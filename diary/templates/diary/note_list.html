{% extends 'diary/base.html' %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Дневник</h1>
    <form method="get">
        <input type="text" name="q" placeholder="Поиск по дневнику...">
        <button type="submit" class="btn btn-primary">Найти</button>
    </form>

    <div class="row">
        {% for object in object_list %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                {% if object.preview %}
                <img src="{{ object.preview.url }}" class="card-img-top" style="height: 200px; object-fit: cover;">
                {% else %}
                <div class="bg-secondary text-white d-flex align-items-center justify-content-center"
                     style="height: 200px;">Нет фото
                </div>
                {% endif %}

                <div class="card-body">
                    <h5 class="card-title">{{ object.title }}</h5>
                    <p class="card-text text-muted">{{ object.content|truncatechars:100 }}</p>
                </div>

                <div class="card-footer bg-transparent border-top-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'diary:post_detail' object.pk %}" class="btn btn-sm btn-outline-primary">Читать
                            далее</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
