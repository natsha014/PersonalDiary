{% extends 'diary/base.html' %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center mx-0">
    <div class="col-12 col-md-10 col-lg-9">
        <div class="card shadow-sm border-0 shadow">

            {% if object.preview %}
            <div class="ratio ratio-16x9" style="max-height: 400px; overflow: hidden;">
                <img src="{{ object.preview.url }}" class="card-img-top w-100" alt="{{ object.title }}"
                     style="object-fit: cover;">
            </div>
            {% endif %}

            <div class="card-body p-3 p-md-4">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-2">
                    <h1 class="card-title h2 mb-0 text-break" style="max-width: 100%;">{{ object.title }}</h1>
                    <span class="badge bg-info text-dark">{{ object.created_at|date:"d.m.Y H:i" }}</span>
                </div>

                <hr>

                <div class="card-text fs-5"
                     style="white-space: pre-wrap; line-height: 1.6; word-wrap: break-word; overflow-wrap: break-word;">
                    {{ object.content }}
                </div>

                <div class="mt-5 pt-3 border-top d-flex flex-column flex-md-row gap-2">
                    <a href="{% url 'diary:note_update' object.pk %}" class="btn btn-warning w-100 w-md-auto">✏️
                        Редактировать</a>
                    <a href="{% url 'diary:note_delete' object.pk %}" class="btn btn-danger w-100 w-md-auto">🗑
                        Удалить</a>
                    <a href="{% url 'diary:note_list' %}" class="btn btn-outline-secondary w-100 w-md-auto">Назад к
                        списку</a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
