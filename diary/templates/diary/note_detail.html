{% extends 'diary/base.html' %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="card shadow-sm">
            {% if object.preview %}
            <img src="{{ object.preview.url }}" class="card-img-top" alt="{{ object.title }}"
                 style="max-height: 400px; object-fit: cover;">
            {% endif %}

            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="card-title h2 mb-0">{{ object.title }}</h1>
                    <span class="badge bg-info text-dark">{{ object.created_at|date:"d.m.Y H:i" }}</span>
                </div>

                <hr>

                <div class="card-text fs-5" style="white-space: pre-wrap; line-height: 1.6;">
                    {{ object.content }}
                </div>

                <div class="mt-5 pt-3 border-top d-flex gap-2">
                    <a href="{% url 'diary:note_update' object.pk %}" class="btn btn-warning">✏️ Редактировать</a>
                    <a href="{% url 'diary:note_delete' object.pk %}" class="btn btn-danger">🗑 Удалить</a>
                    <a href="{% url 'diary:note_list' %}" class="btn btn-outline-secondary">Назад к списку</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
