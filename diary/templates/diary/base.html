<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}МойДневник{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'diary:home' %}">📒 МойДневник</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
            <a class="nav-link text-white" href="{% url 'diary:note_list' %}">Мои записи</a>
            <a class="nav-link text-white" href="{% url 'diary:note_create' %}">➕ Новая заметка</a>
            <a class="nav-link text-white" href="{% url 'users:profile' %}">Профиль ({{ user.email }})</a>
            <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-link nav-link text-white-50">Выйти ({{ user.email }})</button>
            </form>
            {% else %}
            <a class="nav-link text-white" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-light btn-sm ms-2" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container" style="min-height: 80vh;">
    {% block content %}{% endblock %}
</div>

<footer class="container py-4 my-4 border-top text-center text-muted">
    <p>&copy; 2026 Личный дневник &middot; Сделано с любовью на Django</p>
</footer>

<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
