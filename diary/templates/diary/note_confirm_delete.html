{% extends 'diary/base.html' %}

{% block title %}Удаление заметки{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-danger mt-5">
            <div class="card-body p-5">
                <div class="text-danger mb-4">
                    <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
                </div>
                <h2 class="card-title h4">Вы уверены?</h2>
                <p class="text-muted">Вы собираетесь удалить заметку <strong>"{{ object.title }}"</strong>. Это действие
                    нельзя будет отменить.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg">Да, удалить навсегда</button>
                        <a href="{% url 'diary:note_detail' object.pk %}" class="btn btn-outline-secondary">Нет,
                            вернуться назад</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
