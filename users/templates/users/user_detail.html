{% extends 'diary/base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body text-center">
        {% if user.avatar %}
        <img src="{{ user.avatar.url }}" class="rounded-circle mb-3"
             style="width: 150px; height: 150px; object-fit: cover;">
        {% endif %}
        <h3>{{ user.email }}</h3>
        <p class="text-muted">Страна: {{ user.country|default:"Не указана" }}</p>
        <p class="text-muted">Телефон: {{ user.phone_number|default:"Не указан" }}</p>
        <a href="{% url 'users:profile_update' %}" class="btn btn-primary">Редактировать профиль</a>
    </div>
</div>
{% endblock %}
