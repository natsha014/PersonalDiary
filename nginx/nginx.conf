events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name _;

        location /static/ {
            alias /code/staticfiles/;
        }

        location / {
            proxy_pass http://web_diary:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
